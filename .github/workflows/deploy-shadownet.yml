name: Deploy shadownet

# Builds the Next.js static export with the .env-shadownet configuration
# and publishes ./out/ to the AWS S3 bucket behind stake-shadownet.tezos.com,
# then invalidates the CloudFront distribution so users converge to the new
# build. Fires on every push to the `shadownet` branch, or manually.

on:
  push:
    branches: [shadownet]
  workflow_dispatch:

# Queue concurrent deploys instead of cancelling in flight — partial deploys
# on a static site leave inconsistent state (new HTML pointing at not-yet-
# uploaded hashed bundles, etc.).
concurrency:
  group: deploy-shadownet
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # Optional: use a GitHub Environment named "shadownet" to add required
    # reviewers / wait timers / environment-scoped secrets. Safe to delete
    # the next line if you don't want environment protection.
    environment: shadownet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable corepack (Yarn 4.2.2 via packageManager field)
        run: corepack enable

      - name: Cache Yarn install state
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Select shadownet environment
        run: cp .env-shadownet .env

      - name: Build static export
        run: yarn build

      - name: Configure AWS credentials (access keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync hashed assets to S3 (long-TTL, immutable)
        run: |
          aws s3 sync ./out/ s3://${{ vars.AWS_S3_BUCKET }}/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html" \
            --exclude "*.txt" \
            --exclude "*.xml" \
            --exclude "*.json"

      - name: Sync HTML and metadata to S3 (short-TTL)
        run: |
          aws s3 sync ./out/ s3://${{ vars.AWS_S3_BUCKET }}/ \
            --cache-control "public,max-age=60,must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --include "*.txt" \
            --include "*.xml" \
            --include "*.json"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Summary
        run: |
          echo "Deployed commit ${GITHUB_SHA} to s3://${{ vars.AWS_S3_BUCKET }}/"
          echo "Site: https://stake-shadownet.tezos.com"
